[metadata]
name = Education_by_income_level
description = A brief analysis of the correlation between academic performance and household income level
version = 0.0.1
author = ukgovdatascience
platforms = win32
classifiers =
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages =
    education_by_income_level
python_requires = >=3.9
zip_safe = no
install_requires =
    pyyaml

[options.extras_require]
dev =
    coverage
    detect-secrets == 1.0.3
    myst-parser
    pre-commit
    pytest
    detect-secrets
    python-dotenv
    Sphinx
    toml